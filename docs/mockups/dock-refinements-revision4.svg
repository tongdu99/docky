<text x="273" y="915" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#34649d" font-weight="600" text-anchor="start">Pinned</text>
<text x="400" y="802" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#243247" font-weight="400" text-anchor="start">First section: unpinned running apps, growing above the pinned block.</text>
<text x="400" y="835" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#243247" font-weight="400" text-anchor="start">Second section: pinned apps in a stable order. Files and Trash remain after them.</text>
<text x="400" y="868" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#58687d" font-weight="400" text-anchor="start">Example: bottom-left vertical. New running apps extend the dock upward.</text>
<text x="400" y="901" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#58687d" font-weight="400" text-anchor="start">The dock background touches the chosen screen edge; icon padding stays inside.</text>
<text x="400" y="928" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#58687d" font-weight="400" text-anchor="start">The window-level repair is verified; desktop edge tiling still needs a manual check.</text>
