<text x="36" y="42" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#2569c8" font-weight="700" text-anchor="start">REVISION 4 · APPROVED DESIGN</text>
<text x="36" y="84" font-family="Helvetica,Arial,sans-serif" font-size="32" fill="#243247" font-weight="700" text-anchor="start">Choose the position you can see.</text>
<text x="36" y="116" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#58687d" font-weight="400" text-anchor="start">One screen diagram. Twelve direct targets. No orientation category that moves the dock.</text>
