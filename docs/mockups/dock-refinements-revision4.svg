<text x="440" y="370" font-family="Helvetica,Arial,sans-serif" font-size="25" fill="#52677f" font-weight="600" text-anchor="middle">12 positions</text>
<text x="440" y="402" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#52677f" font-weight="400" text-anchor="middle">6 vertical  +  6 horizontal</text>
<text x="440" y="433" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#52677f" font-weight="400" text-anchor="middle">Each corner has two separate choices.</text>
<text x="440" y="490" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#2168d1" font-weight="600" text-anchor="middle">Selected: bottom left · vertical</text>
<text x="52" y="641" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#58687d" font-weight="400" text-anchor="start">Hover: position name     •     Blue outline: current position</text>
<text x="52" y="671" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#58687d" font-weight="400" text-anchor="start">The same diagram appears in Settings and the bar’s right-click menu.</text>
<rect x="872" y="142" width="420" height="556" rx="10" fill="#fff" stroke="none"/>
<text x="896" y="180" font-family="Helvetica,Arial,sans-serif" font-size="23" fill="#243247" font-weight="700" text-anchor="start">A bar inside the dock</text>
