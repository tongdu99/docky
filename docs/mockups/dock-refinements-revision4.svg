<rect x="919" y="487" width="42" height="42" rx="10" fill="#8aa2be" stroke="none"/>
<text x="940" y="515" font-family="Helvetica,Arial,sans-serif" font-size="20" fill="white" font-weight="600" text-anchor="middle">F</text>
<text x="994" y="249" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#243247" font-weight="700" text-anchor="start">Click</text>
<text x="994" y="272" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#58687d" font-weight="400" text-anchor="start">Collapse / expand</text>
<text x="994" y="318" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#243247" font-weight="700" text-anchor="start">Right-click</text>
<text x="994" y="341" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#58687d" font-weight="400" text-anchor="start">Choose position</text>
<text x="994" y="387" font-family="Helvetica,Arial,sans-serif" font-size="16" fill="#243247" font-weight="700" text-anchor="start">Drag</text>
<text x="994" y="410" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#58687d" font-weight="400" text-anchor="start">Move along edges</text>
<text x="896" y="598" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#58687d" font-weight="400" text-anchor="start">Optional bar; no extra handle outside the dock.</text>
<text x="896" y="625" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#58687d" font-weight="400" text-anchor="start">Drag uses the existing repositioning lock.</text>
<text x="896" y="652" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#58687d" font-weight="400" text-anchor="start">Collapsed: only the bar remains. Click to expand.</text>
<rect x="28" y="718" width="1264" height="234" rx="10" fill="#fff" stroke="none"/>
<text x="52" y="755" font-family="Helvetica,Arial,sans-serif" font-size="23" fill="#243247" font-weight="700" text-anchor="start">Running first. Pinned stays anchored. No screen-edge gap.</text>
